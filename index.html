<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valorem Consultoria | Especialistas em Gestão de Pessoas e Liderança</title>
    
    <link rel="icon" type="image/jpeg" href="Logo.jpeg.jpg" id="favicon">
    
    <meta name="description" content="Resultados sustentáveis são construídos com pessoas engajadas. Consultoria especializada em Estratégia, Liderança e Resultados.">

    <!-- Fontes Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FontAwesome para os ícones das Redes Sociais -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-navy: #061121; 
            --navy-light: #0f223f;
            --accent-gold: #C19B54;
            --accent-gold-hover: #D4AF37;
            --text-main: #1E293B;
            --text-muted: #94A3B8;
            --border-color: rgba(193, 155, 84, 0.3);
            --transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; scroll-behavior: smooth; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            color: var(--text-main);
            background-color: var(--primary-navy);
            line-height: 1.7;
            overflow-x: hidden;
            position: relative;
        }

        /* Marca D'água Fundo do Site */
        body::before {
            content: ''; 
            position: fixed; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            width: 100vw; height: 100vh; 
            background-image: url('./Logo.jpeg.jpg');
            background-repeat: no-repeat;
            background-position: center; 
            background-size: 50%; 
            opacity: 0.04; 
            z-index: -1; 
            pointer-events: none;
        }
        .logo-dinamica { display: none; }

        a { text-decoration: none; color: inherit; }
        .container { max-width: 1150px; margin: 0 auto; padding: 0 24px; }

        /* Animações */
        .reveal { opacity: 0; transform: translateY(30px); transition: all 0.8s ease-out; }
        .reveal.active { opacity: 1; transform: translateY(0); }

        /* HEADER */
        header {
            position: fixed; top: 0; left: 0; width: 100%;
            background: rgba(6, 17, 33, 0.95); backdrop-filter: blur(10px);
            z-index: 1000; border-bottom: 1px solid var(--border-color);
        }
        .nav-container { display: flex; justify-content: space-between; align-items: center; height: 80px; }
        .logo-brand { display: flex; align-items: center; gap: 14px; }
        .logo-img { height: 48px; border-radius: 6px; object-fit: contain; }
        .logo-text { display: flex; flex-direction: column; }
        .logo-title { font-size: 1.3rem; font-weight: 800; color: #FFFFFF; letter-spacing: 1px; text-transform: uppercase; }
        .logo-tagline { font-size: 0.7rem; color: var(--accent-gold); font-weight: 700; letter-spacing: 2px; text-transform: uppercase; }

        .nav-links { display: flex; gap: 28px; }
        .nav-links a { color: #E2E8F0; font-size: 0.95rem; font-weight: 500; transition: var(--transition); }
        .nav-links a:hover { color: var(--accent-gold); }

        /* HERO SECTION */
        .hero {
            background: linear-gradient(rgba(6, 17, 33, 0.85), rgba(6, 17, 33, 0.95)), 
                        url('https://images.unsplash.com/photo-1522071820081-009f0129c71c?auto=format&fit=crop&w=2070&q=80') center/cover no-repeat;
            color: #FFFFFF; padding: 180px 0 120px 0; text-align: center; position: relative;
        }
        .hero-badge { display: inline-block; border: 1px solid var(--border-color); color: var(--accent-gold); padding: 6px 20px; border-radius: 50px; font-size: 0.85rem; font-weight: 700; letter-spacing: 2px; margin-bottom: 24px; text-transform: uppercase; }
        .hero h1 { font-size: 3rem; font-weight: 800; max-width: 900px; margin: 0 auto 20px auto; line-height: 1.25; letter-spacing: -1px; }
        .hero p { font-size: 1.15rem; color: #E2E8F0; max-width: 750px; margin: 0 auto 40px auto; line-height: 1.6; }
        
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 32px; background: var(--accent-gold); color: var(--primary-navy); font-weight: 800; font-size: 1rem; border-radius: 8px; transition: var(--transition); border: none; cursor: pointer; text-align: center; }
        .btn:hover { background: var(--accent-gold-hover); transform: translateY(-2px); box-shadow: 0 10px 20px rgba(193, 155, 84, 0.2); }
        .btn-outline { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 16px 32px; border: 1px solid var(--border-color); background: transparent; border-radius: 8px; color: #FFFFFF; font-weight: 700; transition: var(--transition); }
        .btn-outline:hover { background: rgba(193, 155, 84, 0.1); border-color: var(--accent-gold); color: var(--accent-gold); }

        /* QUOTE */
        .quote-section { background-color: var(--navy-light); padding: 80px 0; border-top: 1px solid var(--border-color); border-bottom: 1px solid var(--border-color); text-align: center; }
        .quote-icon { font-size: 3rem; color: var(--accent-gold); margin-bottom: 16px; line-height: 1; }
        .quote-text { font-size: 1.6rem; font-weight: 500; color: #FFFFFF; line-height: 1.5; font-style: italic; margin-bottom: 24px; max-width: 800px; margin-left: auto; margin-right: auto; }
        .quote-author { font-size: 1rem; color: var(--accent-gold); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        /* SOBRE MIM & SEEDING (LADO A LADO) */
        .sobre { padding: 100px 0; background: transparent; color: #FFFFFF; }
        .section-title { color: var(--accent-gold); text-align: center; margin-bottom: 50px; font-size: 2.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        
        .sobre-grid {
            display: grid;
            grid-template-columns: 1.1fr 0.9fr;
            gap: 30px;
            align-items: stretch;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Bloco Esquerdo: História (Carrossel com setas nas extremidades) */
        .historia-box {
            background: var(--navy-light);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 40px 60px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.3);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .carousel-slide { display: none; animation: fadeIn 0.6s ease-in-out; }
        .carousel-slide.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateX(10px); } to { opacity: 1; transform: translateX(0); } }
        
        .carousel-slide p { font-size: 1.02rem; color: #E2E8F0; margin-bottom: 16px; line-height: 1.7; text-align: justify; }
        .carousel-slide b { color: var(--accent-gold); font-weight: 700; }

        /* Botões nas extremidades laterais do bloco esquerdo */
        .carousel-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: var(--primary-navy);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .carousel-btn.prev { left: -22px; }
        .carousel-btn.next { right: -22px; }
        .carousel-btn:hover { background: var(--accent-gold); color: var(--primary-navy); transform: translateY(-50%) scale(1.1); }

        .carousel-footer {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 25px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }
        .carousel-dots { display: flex; gap: 8px; }
        .dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,0.2); cursor: pointer; transition: var(--transition); }
        .dot.active { background: var(--accent-gold); transform: scale(1.2); }

        /* Bloco Direito: Seeding Fixo */
        .seeding-box {
            background: linear-gradient(135deg, rgba(15, 34, 63, 0.95), rgba(6, 17, 33, 0.98));
            border: 1px solid var(--accent-gold);
            border-radius: 16px;
            padding: 35px;
            box-shadow: 0 15px 30px rgba(193, 155, 84, 0.1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }
        .seeding-box h3 {
            font-size: 1.25rem;
            color: var(--accent-gold);
            margin-bottom: 16px;
            font-weight: 700;
            line-height: 1.4;
        }
        .seeding-intro {
            font-size: 0.98rem;
            color: #E2E8F0;
            margin-bottom: 16px;
            line-height: 1.6;
        }
        .seeding-perguntas {
            list-style: none;
            margin-bottom: 16px;
        }
        .seeding-perguntas li {
            position: relative;
            padding-left: 20px;
            margin-bottom: 12px;
            font-size: 0.95rem;
            color: #E2E8F0;
            line-height: 1.5;
        }
        .seeding-perguntas li::before {
            content: '●';
            position: absolute;
            left: 0;
            color: var(--accent-gold);
            font-size: 0.8rem;
            top: 2px;
        }
        .seeding-conclusao {
            font-size: 0.98rem;
            color: #FFFFFF;
            line-height: 1.5;
            font-weight: 600;
            border-left: 3px solid var(--accent-gold);
            padding-left: 14px;
            margin-bottom: 20px;
        }

        /* MÉTODO VLR */
        .metodo { padding: 100px 0; background-color: rgba(15, 34, 63, 0.8); border-top: 1px solid rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.05); }
        .vlr-diagram { display: flex; justify-content: center; align-items: flex-start; position: relative; margin-bottom: 50px; gap: 60px; }
        .vlr-diagram::before { content: ''; position: absolute; top: 55px; left: 25%; right: 25%; height: 1px; background-color: var(--border-color); z-index: 1; }
        .vlr-btn { background: none; border: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; position: relative; z-index: 2; transition: var(--transition); }
        .vlr-circle-item { width: 110px; height: 110px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 3rem; font-weight: 800; border: 2px solid var(--border-color); transition: var(--transition); margin-bottom: 16px; background-color: var(--primary-navy); color: #FFFFFF; }
        .vlr-btn:hover .vlr-circle-item, .vlr-btn.active-btn .vlr-circle-item { transform: scale(1.1); border-color: var(--accent-gold); color: var(--accent-gold); }
        .vlr-label { font-size: 1rem; font-weight: 700; color: #FFFFFF; text-align: center; transition: var(--transition); }
        .vlr-btn:hover .vlr-label, .vlr-btn.active-btn .vlr-label { color: var(--accent-gold); }
        .vlr-content-display { background: var(--primary-navy); border: 1px solid var(--border-color); border-radius: 16px; padding: 50px; max-width: 800px; margin: 0 auto; text-align: center; min-height: 180px; display: flex; align-items: center; justify-content: center; }
        .vlr-text-block { display: none; animation: fadeIn 0.5s; }
        .vlr-text-block.active { display: block; }
        .vlr-text-block h3 { font-size: 1.6rem; color: var(--accent-gold); margin-bottom: 16px; font-weight: 800; }
        .vlr-text-block p { font-size: 1.15rem; color: #E2E8F0; line-height: 1.7; }

        /* ÁREAS DE ATUAÇÃO */
        .atuacao { padding: 100px 0; background-color: transparent; }
        .atuacao-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
        .atuacao-card { background-color: rgba(15, 34, 63, 0.9); border: 1px solid rgba(255,255,255,0.05); padding: 30px; border-radius: 8px; font-weight: 600; font-size: 1.1rem; color: #FFFFFF; display: flex; align-items: center; gap: 20px; transition: var(--transition); }
        .atuacao-card:hover { border-color: var(--border-color); background-color: rgba(193, 155, 84, 0.1); }
        .atuacao-num { color: var(--accent-gold); font-size: 1.4rem; font-weight: 800; }

        /* PALESTRAS */
        .palestras { padding: 100px 0; background: rgba(15, 34, 63, 0.8); border-top: 1px solid rgba(255,255,255,0.05); }
        .palestra-wrapper { display: flex; align-items: center; justify-content: space-between; gap: 60px; max-width: 1000px; margin: 0 auto; }
        .palestra-content { flex: 1; text-align: left; }
        .palestra-badge { background: var(--accent-gold); color: var(--primary-navy); padding: 8px 20px; font-size: 0.9rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; display: inline-block; margin-bottom: 24px; border-radius: 4px; }
        .palestra-content h3 { font-size: 2.2rem; color: #FFFFFF; margin-bottom: 20px; font-weight: 800; }
        .palestra-content p { font-size: 1.1rem; color: #E2E8F0; margin-bottom: 30px; line-height: 1.7; }
        .palestra-image-box { flex: 1; display: flex; justify-content: center; position: relative; }
        
        .palestra-logo-clean { 
            width: 100%; 
            max-width: 320px; 
            height: auto; 
            object-fit: contain; 
            border: none; 
            box-shadow: none; 
            background: transparent; 
            opacity: 0.45; 
            mix-blend-mode: screen; 
            transition: var(--transition);
        }
        .palestra-logo-clean:hover { opacity: 0.7; }

        /* CONTATO E REDES SOCIAIS */
        .contato { padding: 100px 0; background: transparent; color: #FFFFFF; }
        .contato-wrapper { display: grid; grid-template-columns: 1fr 1fr; gap: 60px; align-items: start; }
        .contato-info h2 { font-size: 2rem; line-height: 1.3; margin-bottom: 24px; color: #FFFFFF; font-weight: 800; }
        .contato-info p { color: #E2E8F0; margin-bottom: 40px; font-size: 1.1rem; }
        .contact-buttons { display: flex; flex-direction: column; gap: 16px; }
        .btn-icon { display: flex; align-items: center; justify-content: center; gap: 12px; width: 100%; max-width: 400px; padding: 16px 24px;}
        .contato-form { background: transparent; }
        .form-grupo { margin-bottom: 24px; }
        .form-grupo label { display: block; margin-bottom: 8px; font-size: 1rem; color: #FFFFFF; font-weight: 700; }
        .form-grupo input, .form-grupo textarea { width: 100%; padding: 16px; background-color: rgba(15, 34, 63, 0.9); border: 1px solid rgba(255,255,255,0.1); border-radius: 4px; color: #FFFFFF; font-family: inherit; font-size: 1rem; transition: var(--transition); }
        .form-grupo input:focus, .form-grupo textarea:focus { outline: none; border-color: var(--accent-gold); background-color: rgba(6,17,33,0.95); }

        /* FOOTER */
        footer { background-color: #030811; padding: 40px 0; text-align: center; color: var(--text-muted); font-size
